name: Build Package
# Manual dry-run of the release build path: exercises the same wheel/sdist build
# and SBOM generation as release-package.yml, on the real runner, without
# publishing. (The OIDC publish, Sigstore, and attestation steps cannot be run
# outside a tagged release.)
on: workflow_dispatch

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/
    # Mirror the SBOM generation in release-package.yml so this dry-run catches
    # any breakage in that path before a real release.
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
    - name: Generate CycloneDX SBOM
      run: |
        mkdir -p sbom
        uv export --no-dev --all-extras --no-hashes --no-emit-project \
          --format requirements-txt -o sbom-requirements.txt
        uvx --from cyclonedx-bom cyclonedx-py requirements sbom-requirements.txt \
          --output-format JSON > sbom/resource-id.cdx.json
        rm sbom-requirements.txt
    - name: Store the SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom
        path: sbom/
